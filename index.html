<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ethan Kurylo, game designer</title>
<meta name="description" content="Portfolio of Ethan Kurylo, a cinematic, level and narrative designer. Projects include a Supermassive Games student project, Strays of War and The Last Drop.">
<meta property="og:title" content="Ethan Kurylo, game designer">
<meta property="og:description" content="Cinematic, level and narrative design portfolio.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
/* ------------------------------------------------------------


   black cinema frames. The only accent is the editor's
   selection orange, used for "selected" and focus states.
   ------------------------------------------------------------ */
:root {
  --bg: #000;
  --paper: #EDEDE8;
  --ink: #F2F2EE;
  --muted: #9C9D98;
  --rule: rgba(242, 242, 238, .18);
  --select: #F5A524;
  --black: #000;
  --on-black: #F2F2EE;
  --on-black-muted: #9C9D98;
  --display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --serif: var(--display);
  --gutter: clamp(1.25rem, 5vw, 5rem);
  --max: 1360px;
  --bar: min(16svh, max(72px, calc((100svh - 100vw / 2.39) / 2)));
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--display);
  font-size: 1rem;
  line-height: 1.5;
  font-variation-settings: "wdth" 100;
}
img { display: block; max-width: 100%; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--select); outline-offset: 3px; }

.skip {
  position: absolute; left: 1rem; top: -4rem; z-index: 50;
  background: var(--select); color: var(--black); padding: .6rem 1rem; text-decoration: none; font-weight: 600;
}
.skip:focus { top: 1rem; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- header (lives in the top letterbox bar) ---------- */
.site-head {
  position: absolute; inset: 0 0 auto 0; z-index: 20;
  height: 72px; padding: 0 var(--gutter);
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  color: var(--on-black);
}
.brand {
  text-decoration: none; font-weight: 700; font-size: clamp(1.15rem, 1.6vw, 1.4rem); letter-spacing: .01em;
  font-variation-settings: "wdth" 100;
}
.site-head nav { display: flex; gap: clamp(.9rem, 2.4vw, 2.25rem); white-space: nowrap; }
.site-head nav a {
  text-decoration: none; font-size: clamp(1.05rem, 1.35vw, 1.25rem); color: var(--on-black-muted);
  padding: .25rem 0; border-bottom: 1px solid transparent;
}
.site-head nav a:hover { color: var(--on-black); border-bottom-color: currentColor; }

/* ---------- the stage: a frame between two black bars ---------- */
.stage {
  position: relative; height: 100svh; min-height: 520px; max-height: 1100px;
  background: var(--black); color: var(--on-black); overflow: hidden;
}
.stage .shot { position: absolute; inset: 0; }
.stage .shot .ph { height: 100%; }
.stage .shot img { width: 100%; height: 100%; object-fit: cover; }
.stage .ph.missing { background: var(--black); }
.stage .ph.missing::after { display: none; }
.stage .shot::after { /* gentle grade so type reads over any screenshot */
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,0) 45%);
}
.bar {
  position: absolute; left: 0; right: 0; height: var(--bar); background: var(--black); z-index: 2;
}
.bar.top { top: 0; }
.bar.bottom { bottom: 0; display: grid; place-items: center; padding: 0 var(--gutter); }
.subtitle {
  margin: 0; max-width: 46ch; text-align: center;
  font-size: clamp(1rem, 1.6vw, 1.3rem); font-weight: 500; line-height: 1.35;
  color: var(--on-black);
}
.stage-title {
  position: absolute; z-index: 3; left: var(--gutter); right: var(--gutter);
  bottom: calc(var(--bar) + clamp(1rem, 3vw, 2.25rem));
  margin: 0; color: #fff;
  font-size: clamp(3.2rem, 10vw, 9.5rem); line-height: .86; font-weight: 800;
  font-variation-settings: "wdth" 100; letter-spacing: -.01em;
  text-shadow: 0 2px 30px rgba(0,0,0,.35);
}
.stage-title .logo { display: none; }
.stage-title.has-logo .logo { display: block; max-height: min(30svh, 260px); width: auto; max-width: min(80vw, 720px); }
.stage-title.has-logo .t { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* video in the frame: muted loop that covers the frame, full player on request */
.stage { container-type: size; }
.vid { position: absolute; inset: 0; overflow: hidden; }
.vid iframe {
  position: absolute; top: 50%; left: 50%; border: 0;
  width: max(100cqw, 177.78cqh); height: max(100cqh, 56.25cqw);
  transform: translate(-50%, -50%); pointer-events: none;
  opacity: 0; transition: opacity .8s ease;
}
.vid iframe.ready { opacity: 1; }
.stage.watching .vid iframe {
  top: var(--bar); left: 0; width: 100%; height: calc(100% - 2 * var(--bar));
  transform: none; pointer-events: auto; opacity: 1;
}
.stage.watching .shot::after, .stage.watching .stage-title { opacity: 0; visibility: hidden; }
.stage.watching .shot > .ph, .stage.watching .poster { visibility: hidden; }
.vid video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: transparent; }
.stage.watching .vid video { inset: var(--bar) 0; height: calc(100% - 2 * var(--bar)); object-fit: contain; background: var(--black); }
.inline-vid { display: block; width: 100%; aspect-ratio: 16 / 9; background: var(--black); }
.poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.watch {
  position: absolute; z-index: 4; right: var(--gutter); top: calc(var(--bar) + 1rem);
  display: inline-flex; align-items: center; gap: .6rem; min-height: 44px; padding: 0 1.1rem;
  background: rgba(0,0,0,.55); color: #fff; border: 1px solid rgba(255,255,255,.4);
  font-weight: 600; font-size: .95rem; text-decoration: none; cursor: pointer;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.watch:hover { border-color: var(--select); }
.watch::before { content: ""; width: 0; height: 0; border-style: solid; border-width: 6px 0 6px 10px; border-color: transparent transparent transparent currentColor; }
.stage.watching .watch::before { width: 10px; height: 10px; border: 0; background: currentColor; }
.stage.watching .subtitle { visibility: hidden; }
.stage.watching .watch { top: auto; right: 50%; bottom: calc(var(--bar) / 2 - 22px); transform: translateX(50%); }

/* inline video figures load the player only when clicked */
.ytfig { position: relative; aspect-ratio: 16 / 9; background: var(--black); }
.ytfig button { position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; border: 0; background: none; cursor: pointer; }
.ytfig img { width: 100%; height: 100%; object-fit: cover; }
.ytfig .play {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  display: inline-flex; align-items: center; gap: .6rem; padding: .8rem 1.3rem;
  background: rgba(0,0,0,.7); color: #fff; font-weight: 600; border: 1px solid rgba(255,255,255,.4);
}
.ytfig button:hover .play { border-color: var(--select); }
.ytfig .play::before { content: ""; border-style: solid; border-width: 7px 0 7px 12px; border-color: transparent transparent transparent currentColor; }
.ytfig iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

/* one orchestrated moment: the camera "goes cinematic" on first load */
.hero.intro .bar { animation: bar-in 1.1s cubic-bezier(.7, 0, .2, 1) .35s both; }
.hero.intro .subtitle { animation: sub-in .5s ease 1.45s both; }
@keyframes bar-in { from { height: 0; } to { height: var(--bar); } }
@keyframes sub-in { from { opacity: 0; } to { opacity: 1; } }

.case-hero { height: 88svh; }
.case-hero.no-shot { height: 70svh; }
.case-hero.no-shot .stage-title { color: var(--on-black); }

/* ---------- placeholders: the missing-texture checker ---------- */
.ph { position: relative; background: #111; overflow: hidden; }
.ph.missing img { visibility: hidden; }
.ph.missing {
  background:
    repeating-conic-gradient(#1C1C1C 0 25%, #262626 0 50%) 0 0 / 32px 32px;
}
.ph.missing::after {
  content: attr(data-label); position: absolute; left: .6rem; bottom: .5rem; right: .6rem;
  font-size: .75rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ---------- layout primitives ---------- */
.wrap { max-width: var(--max); margin: 0 auto; padding: 0 var(--gutter); }
section.block { padding: clamp(4rem, 9vw, 8rem) 0; }
.section-title {
  margin: 0 0 clamp(1.5rem, 3vw, 2.5rem);
  font-size: clamp(1.9rem, 3.4vw, 2.8rem); line-height: 1; font-weight: 750;
  font-variation-settings: "wdth" 100;
}
.prose p {
  font-family: var(--serif); font-size: clamp(1.1rem, 1.35vw, 1.25rem); line-height: 1.62;
  margin: 0 0 1em; max-width: 64ch; font-variation-settings: normal;
}
.prose p:last-child { margin-bottom: 0; }

/* ---------- work index ---------- */
.work-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: clamp(2rem, 4vw, 4rem); align-items: start; }
.work-list { list-style: none; margin: 0; padding: 0; border-bottom: 1px solid var(--rule); }
.work-list li { border-top: 1px solid var(--rule); }
.work-row {
  display: grid; grid-template-columns: 1fr; gap: .2rem;
  padding: 1.15rem 0 1.25rem; text-decoration: none; transition: color .2s;
}
.work-title {
  font-size: clamp(1.9rem, 3.6vw, 3.3rem); line-height: .95; font-weight: 760;
  font-variation-settings: "wdth" 100;
}
.work-meta { color: var(--muted); font-size: .98rem; }
.work-meta .status { color: var(--ink); font-weight: 600; }
.work-list:hover .work-row:not(:hover):not(:focus-visible) .work-title { color: rgba(242,242,238,.35); }
.work-thumb { display: none; }

.work-preview { position: sticky; top: 2rem; }
.preview-frame {
  position: relative; aspect-ratio: 16 / 9; background: var(--black);
  outline: 2px solid var(--select); outline-offset: 0;
}
.preview-frame .ph { position: absolute; inset: 0; opacity: 0; transition: opacity .35s ease; }
.preview-frame .ph.on { opacity: 1; }
.preview-frame img { width: 100%; height: 100%; object-fit: cover; }
.title-card {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center;
  color: var(--on-black); padding: 1rem;
}
.title-card strong { display: block; font-size: clamp(2.5rem, 6vw, 5rem); font-weight: 800; font-variation-settings: "wdth" 100; line-height: .9; }
.title-card span { display: block; margin-top: .75rem; color: var(--on-black-muted); }
.preview-caption { margin: .8rem 0 0; color: var(--muted); font-size: .95rem; min-height: 1.5em; }
.preview-caption .note { display: block; margin-top: .25rem; font-size: .8rem; }
.shot-note {
  position: absolute; right: var(--gutter); bottom: calc(var(--bar) + .75rem); z-index: 2; margin: 0;
  font-size: .8rem; color: #fff; background: rgba(0,0,0,.55); padding: .2rem .55rem; border-radius: 3px;
}
.stage.watching .shot-note { display: none; }

/* ---------- about ---------- */
.about-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(2rem, 5vw, 5rem); align-items: start; }
.portrait { aspect-ratio: 4 / 5; }
.portrait img { width: 100%; height: 100%; object-fit: cover; }
.skills { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.5rem 2rem; margin: clamp(2rem, 4vw, 3rem) 0 0; padding-top: 1.5rem; border-top: 1px solid var(--rule); }
.skills h3 { margin: 0 0 .6rem; font-size: 1rem; font-weight: 700; }
.skills ul { list-style: none; margin: 0; padding: 0; color: var(--muted); line-height: 1.75; }
.cta-row { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 2rem; }
.btn {
  display: inline-flex; align-items: center; min-height: 48px; padding: 0 1.4rem;
  background: var(--ink); color: var(--bg); text-decoration: none; font-weight: 600;
  border: 2px solid var(--ink);
}
.btn:hover { background: var(--black); border-color: var(--select); color: #fff; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.ghost:hover { background: var(--ink); color: var(--bg); }

/* ---------- contact: end credits ---------- */
.credits { border-top: 1px solid var(--rule); background: var(--black); color: var(--on-black); text-align: center; padding: clamp(5rem, 12vw, 10rem) 0 3rem; }
.credits h2 { margin: 0; font-size: clamp(2.6rem, 7vw, 6rem); font-weight: 800; line-height: .9; font-variation-settings: "wdth" 100; }
.credits .lede { margin: 1.25rem auto 0; max-width: 46ch; color: var(--on-black-muted); font-family: var(--serif); font-size: 1.15rem; line-height: 1.55; }
.credit-list { display: grid; grid-template-columns: 1fr 1fr; column-gap: 1.75rem; row-gap: .9rem; margin: clamp(3rem, 6vw, 4.5rem) auto 0; max-width: 680px; font-size: clamp(1.05rem, 1.6vw, 1.25rem); }
.credit-list dt { text-align: right; color: var(--on-black-muted); }
.credit-list dd { margin: 0; text-align: left; }
.credit-list a { text-decoration: none; border-bottom: 1px solid rgba(242,242,238,.35); }
.credit-list a:hover { border-bottom-color: var(--select); color: #fff; }
.fine { margin-top: clamp(4rem, 9vw, 7rem); color: #6E6F6B; font-size: .85rem; }

/* ---------- case study ---------- */
.case-body { padding-top: clamp(2.5rem, 5vw, 4rem); padding-bottom: clamp(4rem, 8vw, 6rem); }
.back { display: inline-block; text-decoration: none; font-weight: 600; border-bottom: 1px solid currentColor; padding-bottom: 2px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.25rem 2rem; margin: 2.25rem 0 0; padding: 1.5rem 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.facts dt { color: var(--muted); font-size: .9rem; margin-bottom: .2rem; }
.facts dd { margin: 0; font-size: 1.05rem; line-height: 1.4; }
.chapter { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2.2fr); gap: 1rem clamp(2rem, 5vw, 5rem); padding-top: clamp(3rem, 7vw, 5.5rem); }
.chapter > h2 { margin: 0; font-size: clamp(1.6rem, 2.6vw, 2.2rem); line-height: 1.02; font-weight: 750; font-variation-settings: "wdth" 100; }
.chapter > .figs { grid-column: 1 / -1; margin-top: clamp(1rem, 2vw, 1.5rem); }
.roles { margin: 0; padding: 0; list-style: none; max-width: 64ch; }
.roles li { padding: .85rem 0; border-top: 1px solid var(--rule); }
.roles li:last-child { border-bottom: 1px solid var(--rule); }
.roles strong { display: block; font-weight: 700; font-size: 1.05rem; }
.roles span { font-family: var(--serif); font-size: 1.1rem; line-height: 1.5; color: var(--ink); }

.figs + .figs { margin-top: 1rem; }
.slideshow { position: relative; aspect-ratio: 16 / 9; background: var(--black); overflow: hidden; }
.slideshow .slide { position: absolute; inset: 0; margin: 0; opacity: 0; visibility: hidden; transition: opacity .9s ease, visibility 0s linear .9s; }
.slideshow .slide.on { opacity: 1; visibility: visible; transition: opacity .9s ease; z-index: 1; }
.slideshow .shotbtn, .slideshow .ph { height: 100%; }
.slideshow .ph img { width: 100%; height: 100%; object-fit: cover; }
.figs.row { display: flex; gap: 1rem; align-items: flex-start; }
.figs.row figure { flex: 1 1 0; min-width: 0; }
.figs.row .ph { background: var(--paper); }
.figs.row .ph img { width: 100%; height: 100%; object-fit: contain; }
.figs.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
.figs.grid2 .ph { aspect-ratio: 16 / 10; display: grid; place-items: center; }
.figs.grid2 .ph img { width: 100%; height: 100%; object-fit: contain; }
@media (max-width: 700px) {
  .figs.grid2 { grid-template-columns: 1fr; }
  .figs.row { flex-wrap: wrap; }
  .figs.row figure:first-child { flex-basis: 100% !important; }
}
.ss-controls { display: flex; align-items: center; gap: .5rem; margin-top: .75rem; }
.ss-controls button { min-width: 44px; min-height: 40px; padding: 0 .9rem; background: transparent; color: var(--ink); border: 1px solid var(--rule); cursor: pointer; font-weight: 600; }
.ss-controls button:hover { border-color: var(--select); }
.ss-count { color: var(--muted); font-size: .9rem; min-width: 4.5em; text-align: center; }
.ss-controls .ss-toggle { margin-left: auto; }
.figs.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 1rem; }
.figs.grid .ph { aspect-ratio: 16 / 10; }
.figs.grid .ph img { width: 100%; height: 100%; object-fit: cover; }
.figs.wide { display: grid; gap: 1rem; }
.figs.wide .ph { min-height: 160px; }
.figs.wide .ph img { width: 100%; height: auto; }
.figs.wide .ph.missing { aspect-ratio: 16 / 9; }
.figs.pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 1rem; align-items: start; }
.figs.pair .ph { display: grid; place-items: center; padding: 1rem; }
.figs.pair .ph img { max-height: 85svh; width: auto; max-width: 100%; }
.figs.pair .ph.missing { aspect-ratio: 4 / 5; }
.figs.masonry { columns: 3 260px; column-gap: 1rem; }
.figs.masonry figure { break-inside: avoid; margin-bottom: 1rem; }
.figs.masonry .ph.missing { aspect-ratio: 4 / 3; }
.figs.diagram .ph { background: var(--paper); }
.figs.wide.diagram .ph img { width: auto; max-width: 100%; max-height: 85svh; margin: 0 auto; }
.figs.grid.diagram .ph img { object-fit: contain; }
figure { margin: 0; }
figcaption { margin-top: .5rem; color: var(--muted); font-size: .9rem; }
.shotbtn { display: block; width: 100%; padding: 0; border: 0; cursor: zoom-in; background: none; }
.shotbtn:hover .ph { outline: 2px solid var(--select); }

.gallery-head { margin-top: clamp(3.5rem, 8vw, 6rem); }

.case-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-top: clamp(4rem, 8vw, 6rem); padding-top: 1.5rem; border-top: 1px solid var(--rule); }
.case-nav a { text-decoration: none; }
.case-nav .next { text-align: right; }
.case-nav small { display: block; color: var(--muted); font-size: .95rem; margin-bottom: .3rem; }
.case-nav strong { font-size: clamp(1.6rem, 3.2vw, 2.8rem); line-height: .95; font-weight: 760; font-variation-settings: "wdth" 100; }
.case-nav a:hover strong { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; text-decoration-color: var(--select); }

/* ---------- lightbox ---------- */
.lb { width: 100vw; height: 100dvh; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: var(--black); color: var(--on-black); }
.lb::backdrop { background: var(--black); }
.lb-inner { height: 100%; display: grid; grid-template-rows: 64px minmax(0, 1fr) 64px; }
.lb-top, .lb-bottom { display: flex; align-items: center; justify-content: space-between; padding: 0 var(--gutter); gap: 1rem; }
.lb-stage { position: relative; display: grid; place-items: center; min-height: 0; padding: 0 clamp(3.5rem, 7vw, 6rem); }
.lb-stage .ph { max-width: 100%; max-height: 100%; background: transparent; }
.lb-stage .ph.missing { width: min(100%, 960px); aspect-ratio: 16 / 9; }
.lb-stage img { max-width: 100%; max-height: calc(100dvh - 128px); width: auto; height: auto; object-fit: contain; }
.lb-btn { background: transparent; border: 1px solid rgba(242,242,238,.3); color: var(--on-black); min-width: 44px; min-height: 44px; padding: 0 1rem; cursor: pointer; }
.lb-btn:hover { border-color: var(--select); }
.lb-nav { position: absolute; top: 50%; transform: translateY(-50%); }
.lb-prev { left: var(--gutter); }
.lb-next { right: var(--gutter); }
.lb-count { color: var(--on-black-muted); font-size: .9rem; }
.lb-cap { color: var(--on-black-muted); font-size: .95rem; }

/* ---------- responsive ---------- */
@media (max-width: 900px) {
  .work-grid { grid-template-columns: 1fr; }
  .work-preview { display: none; }
  .work-row { padding-top: 1.25rem; }
  .work-thumb { display: block; aspect-ratio: 16 / 9; margin-bottom: .9rem; }
  .work-thumb .ph { height: 100%; }
  .work-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .work-thumb .title-card strong { font-size: 3rem; }
  .work-list:hover .work-row:not(:hover) .work-title { color: inherit; }
  .about-grid { grid-template-columns: 1fr; }
  .portrait { max-width: 420px; }
  .chapter { grid-template-columns: 1fr; }
}
@media (max-width: 700px) {
  :root { --bar: 76px; }
  .stage { height: 82svh; min-height: 480px; }
  .shot-note { top: calc(var(--bar) + .6rem); bottom: auto; }
  .case-hero { height: 72svh; }
  .case-hero.no-shot { height: 60svh; }
  .skills { grid-template-columns: 1fr 1fr; }
  .credit-list { column-gap: 1rem; }
  .site-head nav a { font-size: 1rem; }
  .lb-stage { padding: 0 .5rem; }
  .lb-nav { top: auto; bottom: -56px; transform: none; }
}
@media (max-width: 760px) {
  .brand .full { display: none; }
}
@media (max-width: 420px) {
  .skills { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

      "role": "Creator and designer",
      "summary": "Co-op puzzle adventure set in an alternate 1974 Prague",
      "tagline": "A stray cat and a stray dog survive the invasion of Prague, and each other.",
      "hero": "7820c2e2-e6a8-402f-a86a-d15d3e728600/HighresScreenshot00018.png",
      "logo": "40ef0a0d-70b5-44d0-8d1b-701a667523d5/Strays+Of+War+Logo.png",
      "facts": [
        [
          "Role",
          "Creator and designer"

          "Genre",
          "Co-op puzzle adventure"

        [
          "Context",
          "University project"
        ],
        [
          "Art",
          "Game artists at UCA, including Lucy Coleman"
        ]
      ],
      "chapters": [
        {
          "h": "The premise",
          "p": [
            "The game takes place in 1974 in Czechoslovakia in Prague, after the events of the Prague Spring in 1968. In this fictional timeline within the game, the occupation of Czechoslovakia escalated into a war between Czechoslovakia and the members of the Warsaw Pact. Through a revolution of the people versus the corrupt government, a new political party created by the people overthrew the government and fought back against the Soviets.",
            "The game starts just as the occupation of Prague is taking place, and the players will control their chosen character as they go about their day-to-day life. Suddenly the war starts around them, as the city of Prague is under attack from the Soviet Union causing destruction and chaos. Within the destruction, the relationship between the characters begins to form as they are forced to work together to survive the war.",
            "The players take control of a cat and a dog, with their story centred around the uneasy relationship between them and is put to the test through environmental circumstances and destruction taking place around them. The game is based around an environmental story and a puzzle adventure that introduces puzzles that the players need to work together to solve to progress through the game."
          ],
          "figs": [
            {
              "layout": "wide",
              "items": [
                {
                  "video": "videos/strays-of-war-gameplay.mp4",
                  "poster": "videos/strays-of-war-gameplay.jpg",
                  "c": "Full gameplay"
                }
              ]
            }
          ]
        },
        {
          "h": "Two characters, two toolsets",
          "p": [
            "The cat jumps, sneaks and knocks things off counters. The dog digs, tracks scents, carries objects and tugs. Both can run and bark or meow, which drives the chase and escape sequences.",
            "The puzzles are built around those differences, and the story is told through the spaces the two of them move through."
          ],

    {
      "slug": "frank-stone",
      "title": "The Casting of Frank Stone",
      "role": "Lead level designer, cinematic designer, director",
      "summary": "University project with Supermassive Games",
      "tagline": "A branching horror scene in Supermassive Games’ world, with cinematics shot on a motion capture stage.",
      "hero": "f6e834d7-76c3-4738-88d4-0ac285faffb5/HighresScreenshot00020.png",
      "thumb": "https://static1.squarespace.com/static/694fa46935cdd81a19738284/694fa88e0b82cf3c02a7fabb/694fa88e0b82cf3c02a7fabc/1785345161231/MainMenu.jpg",
      "facts": [
        [
          "Role",
          "Project coordinator, lead level designer, cinematic designer, director, sound designer"
        ],
        [
          "Team",
          "7: 2 game designers, 1 game developer, 4 game artists"
        ],
        [
          "Context",
          "Industry Brief unit with Supermassive Games, 10 weeks"
        ],
        [
          "Tools",
          "Unreal Engine, Vicon, Live Link Face, ClickUp"
        ]
      ],
      "chapters": [
        {
          "h": "The brief",
          "p": [
            "For our Industry Brief unit, second-year teams each picked one of Supermassive Games’ IPs, built a game on it over ten weeks and presented it to the studio. My team chose The Casting of Frank Stone.",
            "We set out to match Supermassive’s style of gameplay and storytelling as closely as we could, while adding new mechanics of our own without straying from the source material."
          ],
          "figs": [
            {
              "layout": "wide",
              "items": [
                {
                  "yt": "WXIfXz29Tq0",
                  "c": "Full gameplay"
                }
              ]
            }
          ]
        },
        {
          "h": "What I did",
          "roles": [
            [
              "Project coordinator",
              "Ran the team, assigned tasks, supported design decisions and kept our deadlines in ClickUp."
            ],
            [
              "Lead level designer",
              "Built the main level and polished the starter level."
            ],
            [
              "Cinematic designer",
              "Assembled the level sequences: camera work, music, voice lines and sound effects."
            ],
            [
              "Director",
              "Directed our motion capture actors and set up facial capture with Live Link on phones."
            ],
            [
              "Sound designer",
              "Sourced and made the sound effects and music for each level."
            ]
          ]
        },
        {
          "figs": [
            {
              "layout": "slideshow",
              "items": [
                "images/frank-stone/HighresScreenshot00022.jpg",
                "images/frank-stone/HighresScreenshot00023.jpg",
                "images/frank-stone/HighresScreenshot00024.jpg",
                "images/frank-stone/HighresScreenshot00030.jpg",
                "images/frank-stone/HighresScreenshot00031.jpg",
                "images/frank-stone/HighresScreenshot00032.jpg",
                "images/frank-stone/HighresScreenshot00005.jpg",
                "images/frank-stone/HighresScreenshot00007.jpg",
                "images/frank-stone/HighresScreenshot00008.jpg",
                "images/frank-stone/HighresScreenshot00009.jpg",
                "images/frank-stone/HighresScreenshot00016.jpg",
                "images/frank-stone/HighresScreenshot00017.jpg",
                "images/frank-stone/HighresScreenshot00020.jpg",
                "images/frank-stone/HighresScreenshot00021.jpg"
              ]
            }
          ]
        },
        {
          "h": "Mapping the choices",
          "p": [
            "Before building anything, the other designer and I mapped the game in a flow chart: choices that lead to failure or to an easier route, and endings where both characters survive or only one does. We then cut it back to a version we could build well in ten weeks.",
            "Even small moments carry a choice, like who ends up holding the hammer."
          ],
          "figs": [
            {
              "layout": "pair diagram",
              "items": [
                {
                  "k": "fe0e313d-23b2-4a93-bfc6-6207383a8b0a/Flow+Chart.jpg",
                  "c": "The full branching flow chart"
                },
                {
                  "k": "b247082c-026b-4a50-be21-1a579a52c381/Screenshot+2026-01-08+131157.png",

              ]

          ]
        },
        {
          "h": "Directing the capture",
          "p": [
            "It was my first time directing on a Vicon stage. The facial capture headgear held actors back in the fast action scenes, so we shot each scene twice: once for the body with no headgear, then again for the face.",
            "The whole team came to the studio sessions, so everyone saw the sequences come to life before they went into the game."

          "figs": [
            {
              "layout": "masonry",

                "b82b3dc2-10ad-4189-84ca-fad62fd6b346/IMG_6742.jpg",

        },
        {
          "h": "Building the sequences",
          "p": [
            "Back in Unreal, I turned the captured performances into level sequences: placing the cameras, cutting the shots and laying in music, voice lines and sound effects."
          ],
          "figs": [
            {
              "layout": "wide",

<script>
(() => {
  const DATA = JSON.parse(document.getElementById('site-data').textContent);
  const S = DATA.settings, P = DATA.person, PROJECTS = DATA.projects;
  const main = document.getElementById('main');
  const lb = document.querySelector('.lb');
  let view = null;          // 'home' or a project slug
  let firstRender = true;
  let shots = [];           // images available to the lightbox on the current view

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const key = it => typeof it === 'string' ? it : it.k;
  const cap = it => typeof it === 'string' ? '' : (it.c || '');
  const isRemote = k => /^https?:\/\//.test(k);
  const isCdnKey = k => !isRemote(k) && !k.startsWith('images/') && !k.startsWith('./') && !k.startsWith('/');

  // Local path mirrors the CDN key so the download script and the site agree.
  function localPath(k) {
    if (S.local && S.local[k]) return S.local[k];
    if (isRemote(k)) { const parts = new URL(k).pathname.split('/').filter(Boolean); return 'images/' + parts.slice(-2).join('/'); }
    return 'images/' + k;
  }
  function src(k, w) {
    if (!isRemote(k) && !isCdnKey(k)) return k;                 // your own file path
    if (S.assets === 'local') return localPath(k);
    const url = isRemote(k) ? k.replace(/^http:/, 'https:') : S.cdnBase + k;
    return url + '?format=' + w + 'w';
  }
  function srcset(k) {
    if (S.assets === 'local' || (!isRemote(k) && !isCdnKey(k))) return '';
    return [750, 1500, 2500].map(w => src(k, w) + ' ' + w + 'w').join(', ');
  }
  const label = k => decodeURIComponent(k.split('/').pop().replace(/\+/g, ' '));
  const cvUrl = () => S.assets === 'local' ? S.cv.local : S.cv.cdn;

  // An image inside a placeholder that turns into the missing-texture checker if it fails.
  function img(k, { sizes = '100vw', alt = '', eager = false, cls = '' } = {}) {
    const set = srcset(k);
    return `<div class="ph ${cls}" data-label="${esc(label(k))}"><img src="${esc(src(k, 1500))}"${set ? ` srcset="${esc(set)}" sizes="${sizes}"` : ''} alt="${esc(alt)}" ${eager ? 'fetchpriority="high"' : 'loading="lazy"'} decoding="async" onerror="this.parentNode.classList.add('missing')"></div>`;
  }

  const ytThumb = id => `https://i.ytimg.com/vi/${id}/maxresdefault.jpg`;
  const ytWatch = id => `https://www.youtube.com/watch?v=${id}`;
  function ytSrc(id, { muted, start = 0 }) {
    const q = muted
      ? { autoplay: 1, mute: 1, loop: 1, playlist: id, controls: 0, playsinline: 1, rel: 0, iv_load_policy: 3, disablekb: 1, start }
      : { autoplay: 1, mute: 0, controls: 1, playsinline: 1, rel: 0, start: 0 };
    return `https://www.youtube-nocookie.com/embed/${id}?` + new URLSearchParams(q).toString();
  }
  const ytFrame = (id, src, title) => `<iframe src="${src}" title="${esc(title)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;

  function stage({ image, video, title, subtitle, logo, note, cls = '', headingTag = 'h1' }) {
    const v = video && (video.src || video.embeddable !== false) ? video : null;
    const link = video && !video.src && video.embeddable === false ? video : null;
    const hasShot = image || v;
    return `<section class="stage ${cls} ${hasShot ? '' : 'no-shot'}">
      ${hasShot ? `<div class="shot">${image ? img(image, { eager: true }) : `<img class="poster" src="${esc(v.src ? (v.poster || '') : ytThumb(v.id))}" alt="">`}${v ? (v.src
        ? `<div class="vid"><video src="${esc(v.src)}" ${v.poster ? `poster="${esc(v.poster)}"` : ''} muted loop playsinline preload="${REDUCED ? 'none' : 'auto'}" ${REDUCED ? '' : 'autoplay'} aria-label="${esc(title)} show reel"></video></div>`
        : `<div class="vid" data-id="${esc(v.id)}" data-start="${+v.start || 0}" data-title="${esc(title)}"></div>`) : ''}</div>` : ''}
      ${v && v.sound !== false ? `<button class="watch" type="button">${REDUCED ? 'Play video' : 'Play with sound'}</button>` : ''}
      ${link ? `<a class="watch" href="${ytWatch(link.id)}" target="_blank" rel="noopener">Watch the video</a>` : ''}
      <div class="bar top"></div>
      <${headingTag} class="stage-title"><span class="t">${esc(title)}</span>${logo ? `<img class="logo" src="${esc(src(logo, 1500))}" alt="" onload="this.parentNode.classList.add('has-logo')" onerror="this.remove()">` : ''}</${headingTag}>
      ${note && hasShot ? `<p class="shot-note">${esc(note)}</p>` : ''}
      <div class="bar bottom"><p class="subtitle">${esc(subtitle)}</p></div>
    </section>`;
  }

  const captionHtml = p => esc(p.tagline) + (p.heroNote ? `<span class="note">${esc(p.heroNote)}</span>` : '');

  const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Start the muted loop in the frame, and wire the sound button to swap in the full player.
  function mountStageVideo() {
    const st = main.querySelector('.stage'), box = st && st.querySelector('.vid');
    if (!box) return;
    const local = box.querySelector('video');
    if (local) {
      const btn = st.querySelector('button.watch');
      local.muted = true;
      if (!REDUCED) local.play().catch(() => {});
      if (!btn) return;
      btn.addEventListener('click', () => {
        if (st.classList.toggle('watching')) {
          local.muted = false; local.loop = false; local.controls = true;
          local.currentTime = 0; local.play().catch(() => {});
          btn.textContent = 'Close video';
        } else {
          local.controls = false; local.muted = true; local.loop = true;
          if (REDUCED) local.pause(); else local.play().catch(() => {});
          btn.textContent = REDUCED ? 'Play video' : 'Play with sound';
        }
      });
      local.addEventListener('ended', () => { if (st.classList.contains('watching')) btn.click(); });
      return;
    }
    const id = box.dataset.id, start = +box.dataset.start || 0, title = box.dataset.title;
    const btn = st.querySelector('button.watch');
    const loop = () => {
      if (REDUCED) { box.innerHTML = ''; return; }
      box.innerHTML = ytFrame(id, ytSrc(id, { muted: true, start }), title + ' video');
      const f = box.querySelector('iframe');
      f.addEventListener('load', () => setTimeout(() => f.classList.add('ready'), 700));
    };
    loop();
    btn.addEventListener('click', () => {
      if (st.classList.toggle('watching')) {
        box.innerHTML = ytFrame(id, ytSrc(id, { muted: false }), title + ' video');
        btn.textContent = 'Close video';
        box.querySelector('iframe').focus();
      } else {
        btn.textContent = REDUCED ? 'Play video' : 'Play with sound';
        loop();
      }
    });
  }

  function mountInlineVideos() {
    main.querySelectorAll('.ytfig button').forEach(b => b.addEventListener('click', () => {
      const id = b.dataset.yt;
      b.parentNode.innerHTML = ytFrame(id, ytSrc(id, { muted: false }), b.dataset.title);
    }));
  }

  function titleCard(p) {
    return `<div class="title-card"><div><strong>${esc(p.title)}</strong><span>${esc(p.status || '')}</span></div></div>`;
  }

  /* ---------------- home ---------------- */
  function renderHome() {
    const rows = PROJECTS.map((p, i) => `
      <li>
        <a class="work-row" href="#${p.slug}" data-i="${i}">
          <div class="work-thumb">${p.hero ? img(p.thumb || p.hero, { sizes: '100vw' }) : `<div class="ph" style="height:100%">${titleCard(p)}</div>`}</div>
          <div class="work-title">${esc(p.title)}</div>
          <div class="work-meta">${p.status ? `<span class="status">${esc(p.status)}.</span> ` : ''}${esc(p.role)}. ${esc(p.summary)}.</div>
        </a>
      </li>`).join('');

    const previews = PROJECTS.map((p, i) => p.hero
      ? img(p.thumb || p.hero, { sizes: '(max-width: 900px) 0px, 55vw', cls: i === 0 ? 'on' : '' }).replace('class="ph ', `data-i="${i}" class="ph `)
      : `<div class="ph ${i === 0 ? 'on' : ''}" data-i="${i}">${titleCard(p)}</div>`).join('');

    const skills = P.skills.map(s => `<div><h3>${esc(s.title)}</h3><ul>${s.items.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>`).join('');

    const credits = [
      ...(S.email ? [{ label: 'Email', text: S.email, url: 'mailto:' + S.email }] : []),
      ...P.links,
      ...(S.playableCv ? [{ label: 'Playable CV', text: 'Play it', url: S.playableCv }] : []),
      { label: 'CV', text: 'Download (PDF)', url: cvUrl() }
    ].map(l => `<dt>${esc(l.label)}</dt><dd><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.text)}</a></dd>`).join('');

    main.innerHTML = `
      ${stage({ image: P.heroImage, video: P.heroVideo, title: P.name, subtitle: P.subtitle, cls: 'hero' + (firstRender ? ' intro' : '') })}

      <section id="work" class="block" aria-labelledby="work-h">
        <div class="wrap">
          <h2 class="section-title" id="work-h">Projects</h2>
          <div class="work-grid">
            <ul class="work-list">${rows}</ul>
            <div class="work-preview" aria-hidden="true">
              <div class="preview-frame">${previews}</div>
              <p class="preview-caption">${captionHtml(PROJECTS[0])}</p>
            </div>
          </div>
        </div>
      </section>

      <section id="about" class="block" aria-labelledby="about-h" style="padding-top:0">
        <div class="wrap about-grid">
          ${img(P.portrait, { sizes: '(max-width: 900px) 90vw, 40vw', alt: 'Portrait of ' + P.name, cls: 'portrait' })}
          <div>
            <h2 class="section-title" id="about-h">About</h2>
            <div class="prose">${P.about.map(t => `<p>${esc(t)}</p>`).join('')}</div>
            <div class="cta-row">
              ${S.playableCv ? `<a class="btn" href="${esc(S.playableCv)}" target="_blank" rel="noopener">Play my CV</a>` : ''}
              <a class="btn ${S.playableCv ? 'ghost' : ''}" href="${esc(cvUrl())}" target="_blank" rel="noopener">Download my CV (PDF)</a>
              <a class="btn ghost" href="#contact">Get in touch</a>
            </div>
            <div class="skills">${skills}</div>
          </div>
        </div>
      </section>

      <section id="contact" class="credits" aria-labelledby="contact-h">
        <div class="wrap">
          <h2 id="contact-h">Get in touch</h2>
          <p class="lede">I’m looking for my first role as a cinematic, level or narrative designer, and I’m always happy to talk through any of these projects.</p>
          <dl class="credit-list">${credits}</dl>
          ${S.email ? `<p class="fine" style="margin-top:2rem">${esc(S.email)}</p>` : ''}
          <p class="fine">© ${new Date().getFullYear()} ${esc(P.name)}</p>
        </div>
      </section>`;

    // hover / focus a row to "select" its shot in the preview frame
    const frames = main.querySelectorAll('.preview-frame > [data-i]');
    const caption = main.querySelector('.preview-caption');
    main.querySelectorAll('.work-row').forEach(row => {
      const show = () => {
        const i = +row.dataset.i;
        frames.forEach(f => f.classList.toggle('on', +f.dataset.i === i));
        caption.innerHTML = captionHtml(PROJECTS[i]);
      };
      row.addEventListener('mouseenter', show);
      row.addEventListener('focus', show);
    });
    shots = [];
    mountStageVideo();
  }

  /* ---------------- case study ---------------- */
  function figure(it, layout) {
    if (it && it.video) {
      const auto = it.autoplay ? 'muted loop data-autoplay preload="metadata"' : 'preload="none"';
      const ratio = it.ratio ? ` style="aspect-ratio: ${esc(it.ratio)}"` : '';
      const grow = it.ratio ? ` style="flex-grow: ${it.ratio.split('/').map(Number).reduce((a, b) => a / b)}"` : '';
      return `<figure${grow}><video class="inline-vid"${ratio} src="${esc(it.video)}" ${it.poster ? `poster="${esc(it.poster)}"` : ''} controls ${auto} playsinline aria-label="${esc(it.c || 'Video')}"></video>${it.c ? `<figcaption>${esc(it.c)}</figcaption>` : ''}</figure>`;
    }
    if (it && it.yt) {
      const c = it.c || 'Video';
      return `<figure><div class="ytfig"><button type="button" data-yt="${esc(it.yt)}" data-title="${esc(c)}" aria-label="Play video: ${esc(c)}"><img src="${ytThumb(it.yt)}" alt="" loading="lazy"><span class="play">Play video</span></button></div>${it.c ? `<figcaption>${esc(it.c)}</figcaption>` : ''}</figure>`;
    }
    const i = shots.length;
    shots.push(it);
    const sizes = layout.includes('wide') ? '(max-width: 1360px) 100vw, 1360px' : '(max-width: 700px) 100vw, 33vw';
    const c = cap(it);
    if (it && it.ratio) {
      const g = it.ratio.split('/').map(Number).reduce((a, b) => a / b);
      return `<figure style="flex-grow: ${g}"><button class="shotbtn" data-shot="${i}" aria-label="View image larger${c ? ': ' + esc(c) : ''}"><div class="ph" style="aspect-ratio: ${esc(it.ratio)}" data-label="${esc(label(key(it)))}"><img src="${esc(src(key(it), 1500))}" alt="${esc(c)}" loading="lazy" decoding="async" onerror="this.parentNode.classList.add('missing')"></div></button>${c ? `<figcaption>${esc(c)}</figcaption>` : ''}</figure>`;
    }
    return `<figure><button class="shotbtn" data-shot="${i}" aria-label="View image larger${c ? ': ' + esc(c) : ''}">${img(key(it), { sizes, alt: c })}</button>${c ? `<figcaption>${esc(c)}</figcaption>` : ''}</figure>`;
  }
  function slideshow(g) {
    const slides = g.items.map((it, j) => {
      const i = shots.length; shots.push(it);
      return `<figure class="slide ${j ? '' : 'on'}"><button class="shotbtn" data-shot="${i}" aria-label="View image larger">${img(key(it), { sizes: '(max-width: 1360px) 100vw, 1360px', alt: cap(it), eager: j === 0 })}</button></figure>`;
    }).join('');
    return `<div class="figs slideshow-wrap" data-ss>
      <div class="slideshow" aria-roledescription="slideshow" aria-label="Project images">${slides}</div>
      <div class="ss-controls">
        <button type="button" data-ss-prev aria-label="Previous image">Prev</button>
        <span class="ss-count" aria-live="polite">1 / ${g.items.length}</span>
        <button type="button" data-ss-next aria-label="Next image">Next</button>
        <button type="button" class="ss-toggle" data-ss-toggle>${REDUCED ? 'Play' : 'Pause'}</button>
      </div>
    </div>`;
  }

  function mountSlideshows() {
    main.querySelectorAll('[data-ss]').forEach(w => {
      const slides = [...w.querySelectorAll('.slide')], count = w.querySelector('.ss-count'), tog = w.querySelector('[data-ss-toggle]');
      let i = 0, timer = null, playing = !REDUCED, hover = false;
      const go = n => { slides[i].classList.remove('on'); i = (n + slides.length) % slides.length; slides[i].classList.add('on'); count.textContent = `${i + 1} / ${slides.length}`; };
      const tick = () => { if (!hover && document.visibilityState === 'visible') go(i + 1); };
      const sync = () => { clearInterval(timer); timer = playing ? setInterval(tick, 4500) : null; tog.textContent = playing ? 'Pause' : 'Play'; };
      w.querySelector('[data-ss-prev]').addEventListener('click', () => { go(i - 1); sync(); });
      w.querySelector('[data-ss-next]').addEventListener('click', () => { go(i + 1); sync(); });
      tog.addEventListener('click', () => { playing = !playing; sync(); });
      const ss = w.querySelector('.slideshow');
      ss.addEventListener('mouseenter', () => hover = true);
      ss.addEventListener('mouseleave', () => hover = false);
      sync();
    });
  }

  // Looping clips play while on screen and pause when scrolled away.
  function mountAutoVideos() {
    const vids = [...main.querySelectorAll('video[data-autoplay]')];
    if (!vids.length || REDUCED || !('IntersectionObserver' in window)) return;
    const io = new IntersectionObserver(es => es.forEach(e => {
      const v = e.target;
      if (e.isIntersecting) { v.muted = true; v.play().catch(() => {}); } else v.pause();
    }), { threshold: 0.35 });
    vids.forEach(v => io.observe(v));
  }

  function figGroup(g) {
    if (g.layout.includes('slideshow')) return slideshow(g);
    return `<div class="figs ${esc(g.layout)}">${g.items.map(it => figure(it, g.layout)).join('')}</div>`;
  }

  function renderCase(p) {
    shots = [];
    const idx = PROJECTS.indexOf(p);
    const prev = PROJECTS[(idx - 1 + PROJECTS.length) % PROJECTS.length];
    const next = PROJECTS[(idx + 1) % PROJECTS.length];

    const chapters = p.chapters.map(ch => `
      <section class="chapter">
        ${ch.h ? `<h2>${esc(ch.h)}</h2>
        <div class="prose">
          ${(ch.p || []).map(t => `<p>${esc(t)}</p>`).join('')}
          ${ch.roles ? `<ul class="roles">${ch.roles.map(([r, d]) => `<li><strong>${esc(r)}</strong><span>${esc(d)}</span></li>`).join('')}</ul>` : ''}
        </div>` : ''}
        ${(ch.figs || []).map(figGroup).join('')}
      </section>`).join('');

    const gallery = p.gallery && p.gallery.length ? `
      <section class="chapter gallery-head">
        <h2>${esc(p.galleryTitle || 'More from the project')}</h2>
        <div></div>
        ${figGroup({ layout: 'grid', items: p.gallery })}
      </section>` : '';

    main.innerHTML = `
      <article>
        ${stage({ image: p.hero, video: p.video, title: p.title, subtitle: p.tagline, logo: p.logo, note: p.heroNote, cls: 'case-hero' })}
        <div class="wrap case-body">
          <a class="back" href="#work">All projects</a>
          <dl class="facts">${p.facts.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>
          ${chapters}
          ${gallery}
          <nav class="case-nav" aria-label="More projects">
            <a href="#${prev.slug}"><small>Previous</small><strong>${esc(prev.title)}</strong></a>
            <a class="next" href="#${next.slug}"><small>Next</small><strong>${esc(next.title)}</strong></a>
          </nav>
        </div>
      </article>`;

    main.querySelectorAll('[data-shot]').forEach(b => b.addEventListener('click', () => openLb(+b.dataset.shot)));
    mountStageVideo();
    mountInlineVideos();
    mountSlideshows();
    mountAutoVideos();
  }

  /* ---------------- lightbox ---------------- */
  let lbi = 0;
  const lbPh = lb.querySelector('.lb-ph'), lbImg = lbPh.querySelector('img');
  lbImg.addEventListener('error', () => lbPh.classList.add('missing'));
  function showLb() {
    const it = shots[lbi], k = key(it);
    lbPh.classList.remove('missing');
    lbPh.dataset.label = label(k);
    lbImg.removeAttribute('srcset');
    lbImg.src = src(k, 2500);
    lbImg.alt = cap(it);
    lb.querySelector('.lb-cap').textContent = cap(it);
    lb.querySelector('.lb-count').textContent = `${lbi + 1} of ${shots.length}`;
  }
  function openLb(i) { lbi = i; showLb(); try { lb.showModal(); } catch (e) { lb.setAttribute('open', ''); } }
  function step(d) { lbi = (lbi + d + shots.length) % shots.length; showLb(); }
  lb.addEventListener('click', e => {
    const a = e.target.closest('[data-lb]');
    if (a) { a.dataset.lb === 'close' ? lb.close() : step(a.dataset.lb === 'next' ? 1 : -1); return; }
    if (e.target === lb || e.target.classList.contains('lb-stage')) lb.close();
  });
  lb.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') step(1);
    if (e.key === 'ArrowLeft') step(-1);
  });

  /* ---------------- routing ---------------- */
  // A project slug in the hash opens its case study; anything else is a spot on the home page.
  function route() {
    const h = decodeURIComponent(location.hash.slice(1));
    const p = PROJECTS.find(x => x.slug === h);
    if (p) {
      if (view !== p.slug) { renderCase(p); view = p.slug; }
      document.title = `${p.title} | ${P.name}, game designer`;
      window.scrollTo(0, 0);
    } else {
      if (view !== 'home') { renderHome(); view = 'home'; }
      document.title = `${P.name}, game designer`;
      const target = h && h !== 'top' && document.getElementById(h);
      if (target) target.scrollIntoView(); else window.scrollTo(0, 0);
    }
    firstRender = false;
  }
  window.addEventListener('hashchange', route);

  document.querySelector('[data-cv]').href = S.playableCv || cvUrl();
  document.querySelector('[data-skip]').addEventListener('click', e => { e.preventDefault(); main.focus(); main.scrollIntoView(); });
  document.querySelector('[data-home]').addEventListener('click', e => {
    if (!location.hash || location.hash === '#top') { e.preventDefault(); window.scrollTo({ top: 0 }); }
  });

  route();
})();
</script>
</body>
</html>
